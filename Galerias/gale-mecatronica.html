<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - SOFTECH</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../style.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Fuente de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <style>
        .carousel-item img {
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
        }
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            padding: 15px;
        }
        /* Estilo de tarjeta con fondo limpio alineado al diseño de reseñas */
        .galeria-card {
            background-color: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 30px;
        }
    </style>
</head>
<body>

    <!-- Encabezado / Navbar -->
    <nav id="navbar-desktop" class="bg-superior navbar navbar-expand-md text-center p-3">
        <div class="container-fluid m-0 p-0">
            <div class="col-9 col-md-4 d-flex flex-row">
                <div>
                    <a href="https://tecnicosuperiorneiva.edu.co" target="_blank">
                        <img src="../imagenes/ColegioLogo2.png" alt="Tecnico Superior" class="TecLogo me-3">
                    </a>
                </div>
                <div class="align-content-center text-start">
                    <a href="Software.html" class="TTecnico">I.E. TECNICO SUPERIOR</a>
                </div>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
                
            <div class="justify-content-md-end collapse navbar-collapse" id="nav">
                <ul class="navbar-nav">
                    <li class="nav-item PLink"><a href="../especialidades.html/Mecatronica.html" class="nav-link">Inicio</a></li>
                   
                    
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal de Galerías por Año -->
    <main class="container my-5">
        <h1 class="text-center mb-5 fw-bold">Galería de Imágenes por Año</h1>

        <!-- ================= GALERÍA 2026 ================= -->
        <section class="mb-5 galeria-card">
            <h2 class="fw-bold mb-3">2026</h2>
            <div id="carrusel2026" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <!-- Indicadores abajo (8 puntos para las 8 imágenes restantes del 2 al 9) -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carrusel2026" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carrusel2026" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carrusel2026" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carrusel2026" data-bs-slide-to="3" aria-label="Slide 4"></button>
                    
                   
                </div>

                <!-- Imágenes del 2 al 9 en bucle automático continuo -->
                <div class="carousel-inner pb-5">
                    <div class="carousel-item active">
                        <img src="../imagenes/QUIENES SOMOS MECA.jpeg" class="d-block w-100" alt="Galería 2026 - Imagen 2">
                    </div>
                    <div class="carousel-item">
                        <img src="../imagenes/premios asmi.jpeg" class="d-block w-100" alt="Galería 2026 - Imagen 3">
                    </div>
                    <div class="carousel-item">
                        <img src="../imagenes/que enseñamos.jpeg" class="d-block w-100" alt="Galería 2026 - Imagen 4">
                    </div>
                    <div class="carousel-item">
                        <img src="../imagenes/1mecatronica.jpeg" class="d-block w-100" alt="Galería 2026 - Imagen 5">
                    </div>
                    <div class="carousel-item">
                        <img src="../imagenes/2mecaronica.jpeg" class="d-block w-100" alt="Galería 2026 - Imagen 6">
                    </div>
                   
                </div>

                <!-- Flechas manuales -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carrusel2026" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carrusel2026" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </section>

        <!-- ================= GALERÍA 2027 ================= -->
        <section class="mb-5 galeria-card">
            <h2 class="fw-bold mb-3">2027</h2>
            <div id="carrusel2027" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <!-- Indicadores abajo -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carrusel2027" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carrusel2027" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carrusel2027" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>

                <!-- Imágenes en bucle automático -->
                <div class="carousel-inner pb-5">
                    <div class="carousel-item active">
                        <img src="../imagenes/imajen en blanco.webp" class="d-block w-100" alt="Galería 2027 - Imagen 1">
                    </div>
                    <div class="carousel-item">
                        <img src="../imagenes/imajen en blanco.webp" class="d-block w-100" alt="Galería 2027 - Imagen 2">
                    </div>
                    <div class="carousel-item">
                        <img src="../imagenes/imajen en blanco.webp" class="d-block w-100" alt="Galería 2027 - Imagen 3">
                    </div>
                </div>

                <!-- Flechas manuales -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carrusel2027" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carrusel2027" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </section>
    </main>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
